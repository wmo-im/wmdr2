$schema: 'https://json-schema.org/draft/2020-12/schema'
$id: 'https://raw.githubusercontent.com/wmo-im/wmdr2/main/schemas/wmdrRecordGeoJSON.yaml'
title: WMDR station metadata record definition
description: WMDR station metadata record definition
type: object
properties:
  id:
    type: string
    description: WIGOS station identifier
    pattern: "^(0|1|2|3)-([1-9]\\d*)-([0-9]+)-([A-Za-z0-9._-]+)$"
  conformsTo:
    type: array
    contains:
      const: http://wigos.wmo.int/spec/wmdr/2/conf/core
  type:
    $ref: 'https://schemas.opengis.net/ogcapi/records/part1/1.0/openapi/schemas/recordGeoJSON.yaml#/properties/type'
  geometry:
    $ref: 'https://schemas.opengis.net/ogcapi/features/part1/1.0/openapi/schemas/pointGeoJSON.yaml'
  time:
    $ref: 'temporal.yaml#/time'
  properties:
    type: object
    properties:
      title:
        type: string
        description: facility name (primary)
      description:
        type: string
        description: facility description
      additionalTitles:
        type: array
        minItems: 1
        items:
          type: string
          description: additional facility names
      additionalIds:
        type: array
        minItems: 1
        items:
          type: string
          description: additional WIGOS Station Identifiers (WSI)
          pattern: "^(0|1|2|3)-([1-9]\\d*)-([0-9]+)-([A-Za-z0-9._-]+)$"
      facilityType:
        type: string
        description: Station/platform type
        $comment: https://codes.wmo.int/wmdr/FacilityType
      wmoRegion:
        type: string
        description: WMO Region
        $comment: https://codes.wmo.int/wmdr/WMORegion
      contacts:
        type: array
        description: reusable OGC contact registry for this WMDR record
        items:
          $ref: 'https://schemas.opengis.net/ogcapi/records/part1/1.0/openapi/schemas/contact.yaml'
      contactAssignments:
        type: array
        description: facility-level associations to reusable contacts
        items:
          $ref: 'contactAssignment.yaml'
      externalIds:
        $ref: 'https://schemas.opengis.net/ogcapi/records/part1/1.0/openapi/schemas/recordCommonProperties.yaml#/properties/externalIds'
      created:
        $ref: 'https://schemas.opengis.net/ogcapi/records/part1/1.0/openapi/schemas/recordCommonProperties.yaml#/properties/created'
      updated:
        $ref: 'https://schemas.opengis.net/ogcapi/records/part1/1.0/openapi/schemas/recordCommonProperties.yaml#/properties/updated'
      keywords:
        $ref: 'https://schemas.opengis.net/ogcapi/records/part1/1.0/openapi/schemas/recordCommonProperties.yaml#/properties/keywords'
      themes:
        $ref: 'https://schemas.opengis.net/ogcapi/records/part1/1.0/openapi/schemas/recordCommonProperties.yaml#/properties/themes'
      territory:
        type: array
        description: time series of territories
        minItems: 1
        items:
          type: object
          properties:
            territory:
              type: string
              description: Territory of origin of data
              $comment: https://codes.wmo.int/wmdr/TerritoryName
            time:
              $ref: 'temporal.yaml#/timePeriod'
          required:
            - territory
      territories:
        type: array
        description: alias for territory; retained for compatibility with earlier draft records
        minItems: 1
        items:
          type: object
          properties:
            territory:
              type: string
              description: Territory of origin of data
              $comment: https://codes.wmo.int/wmdr/TerritoryName
            dates:
              $ref: 'temporal.yaml#/dates'
            time:
              $ref: 'temporal.yaml#/timePeriod'
          required:
            - territory
      programAffiliations:
        type: array
        description: program affiliations
        minItems: 1
        items:
          type: object
          properties:
            facilityId:
              type: string
              description: Programme specific facility identifier
            facilityTitle:
              type: string
              description: Programme specific facility name
            programSpecificFacilityId:
              type: string
              description: Programme specific facility identifier
            programSpecificFacilityTitle:
              type: string
              description: Programme specific facility name
            programAffiliation:
              type: string
              description: Programme/network affiliation
              $comment: https://codes.wmo.int/wmdr/ProgramAffiliation
            reportingStatus:
              type: string
              description: Station/Platform reporting status in this programme
              $comment: https://codes.wmo.int/wmdr/ReportingStatus
            dates:
              $ref: 'temporal.yaml#/dates'
            time:
              $ref: 'temporal.yaml#/timePeriod'
      observingCapabilities:
        type: array
        description: observation series / observing capability descriptions
        minItems: 1
        items:
          $ref: 'observingCapability.yaml'
      instruments:
        type: array
        description: reusable instrument catalogue entries; serial numbers are recorded on observing configurations
        items:
          $ref: 'instrument.yaml'
      schedules:
        type: array
        description: reusable observing/reporting schedules
        items:
          $ref: 'schedule.yaml'
    required:
      - title
      - observingCapabilities
  links:
    type: array
    items:
      $ref: 'https://raw.githubusercontent.com/opengeospatial/ogcapi-features/master/core/openapi/schemas/link.yaml'
required:
  - id
  - conformsTo
  - type
  - geometry
  - properties
