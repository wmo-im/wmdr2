---
type: object
description: Reusable instrument catalogue entry. Serial numbers are not catalogue metadata; they belong to observingConfiguration.
properties:
  id:
    type:
      - string
      - integer
    description: instrument identifier
  manufacturer:
    type: string
    description: instrument manufacturer
  model:
    type: string
    description: instrument model
  observingMethods:
    type: array
    items:
      type: string
required:
  - id
